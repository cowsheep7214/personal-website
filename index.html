<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>justin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 120px 32px 160px;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .intro {
      font-size: 17px;
      max-width: 480px;
    }

    /* Top-right icon dock */
    nav.dock {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    nav.dock a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      color: var(--muted);
      overflow: hidden;
      transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav.dock a .ink {
      position: absolute;
      top: var(--y, 50%);
      left: var(--x, 50%);
      width: 0;
      height: 0;
      background: var(--text);
      border-radius: 999px;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    nav.dock a:hover {
      color: var(--bg);
    }
    nav.dock a:hover .ink {
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%) scale(1);
    }
    nav.dock a svg {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <nav class="dock">
    <a href="sms:" aria-label="Text message">
      <span class="ink"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </a>
    <a href="mailto:justinhasgame21@gmail.com" aria-label="Email">
      <span class="ink"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
    </a>
    <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
      <span class="ink"></span>
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>
  </nav>

  <main>
    <h1>hi, i'm justin :)</h1>
    <p class="intro">
      i like building stuff. you can find things i've built and what i've learned from them here.
    </p>
  </main>

  <script>
    document.querySelectorAll('nav.dock a').forEach(el => {
      el.addEventListener('pointerenter', e => {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--x', (e.clientX - r.left) + 'px');
        el.style.setProperty('--y', (e.clientY - r.top) + 'px');
      });
    });
  </script>
</body>
</html>
